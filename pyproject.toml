[project]
name = "otakuchat"
version = "0.1.0"
description = "A self-curating TUI chat harness for local Ollama models — Hermes-inspired, chat-only, no shell exposure."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.60.0",
]

[project.optional-dependencies]
# Opt-in headless-browser fallback for JS-rendered pages that the stdlib
# extraction tier (otakuchat/extract.py) can't get real text out of.
# `EXTRACT.use_browser_fallback` stays off by default even with this
# installed — the app never launches a browser unless both are true.
browser = [
    "playwright>=1.40.0",
]

[project.scripts]
otakuchat = "otakuchat.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["otakuchat"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
