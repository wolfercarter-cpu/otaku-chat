[project]
name = "otakuchat"
version = "0.1.0"
description = "A self-curating TUI chat harness for local Ollama models — Hermes-inspired, chat-only, no shell exposure."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.60.0",
]

[project.scripts]
otakuchat = "otakuchat.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["otakuchat"]
